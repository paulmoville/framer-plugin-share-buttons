<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>1.0.0 share bar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f6f6f6; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .stage {
      width: 720px;
      height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 28px;
      gap: 10px;
    }
    .kicker {
      margin: 0;
      color: #888;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 13px; font-weight: 600; color: #333; }
    .row { display: flex; gap: 8px; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 14px;
      border: 1.5px solid #111;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-size: 12px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">1.0.0 · Inserted component</p>
    <h1>Share</h1>
    <div class="row">
      <span class="pill">Copy</span>
      <span class="pill">Email</span>
      <span class="pill">WhatsApp</span>
      <span class="pill">Facebook</span>
      <span class="pill">X</span>
      <span class="pill">LinkedIn</span>
    </div>
  </div>
</body>
</html>
