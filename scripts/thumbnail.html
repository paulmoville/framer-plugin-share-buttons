<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, height=1200" />
    <title>Share Buttons thumbnail</title>
    <style>
        html,
        body {
            margin: 0;
            width: 1600px;
            height: 1200px;
            overflow: hidden;
            background: #d8cbb8;
        }

        .plate {
            position: absolute;
            inset: 0;
            background: #d8cbb8 url("studio-plate.png") center / cover no-repeat;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse 70% 62% at 50% 46%,
                rgba(255, 250, 242, 0.08) 0%,
                rgba(80, 58, 36, 0.1) 100%
            );
            pointer-events: none;
        }

        .stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 36px;
            padding: 72px 96px 80px;
            box-sizing: border-box;
        }

        .plugin-shot {
            position: relative;
            z-index: 1;
            width: 760px;
            height: 680px;
            object-fit: cover;
            object-position: top center;
            border-radius: 28px;
            background: #fff;
            box-shadow:
                0 1px 0 rgba(255, 255, 255, 0.7) inset,
                0 2px 3px rgba(72, 52, 32, 0.04),
                0 18px 40px rgba(72, 52, 32, 0.1),
                0 48px 90px rgba(62, 42, 24, 0.16);
            transform: rotate(-0.45deg) translateY(-8px);
        }

        .bar-shot {
            position: relative;
            z-index: 2;
            width: 1080px;
            height: auto;
            filter: drop-shadow(0 16px 28px rgba(62, 42, 24, 0.16));
            transform: rotate(0.35deg) translateY(6px);
        }
    </style>
</head>
<body>
    <div class="plate"></div>
    <div class="vignette"></div>
    <div class="stage">
        <img class="plugin-shot" src="plugin-capture.png" alt="" />
        <img class="bar-shot" src="bar-capture.png" alt="" />
    </div>
</body>
</html>
