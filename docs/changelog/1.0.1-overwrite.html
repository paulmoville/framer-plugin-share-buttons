<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>1.0.1 overwrite confirm</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ececec; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .stage { width: 420px; height: 420px; padding: 28px; }
    .card {
      width: 364px;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      padding: 16px;
    }
    .kicker {
      margin: 0 0 12px;
      color: #888;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #eee;
      color: #333;
      font-size: 12px;
      line-height: 1.45;
    }
    button {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 40px;
      margin: 0 0 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
    }
    .primary {
      border: 0;
      background: #0099ff;
      color: #fff;
    }
    .secondary {
      border: 1px solid #e6e6e6;
      background: #eee;
      color: #333;
    }
    .foot {
      margin-top: 8px;
      color: #aaa;
      font-size: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="stage">
    <p class="kicker">1.0.1 · Insert confirm</p>
    <div class="card">
      <p class="status">This project already has ShareButtons.tsx. Keep that file, or replace it with this plugin version before inserting.</p>
      <button class="primary" type="button">Keep existing file</button>
      <button class="secondary" type="button">Replace file and insert</button>
      <button class="secondary" type="button">Cancel</button>
      <div class="foot">
        Version 1.0.1<br />
        Lebel Studio<br />
        hello@wearelebel.com
      </div>
    </div>
  </div>
</body>
</html>
